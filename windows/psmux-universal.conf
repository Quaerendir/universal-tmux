##### ==============================================
##### PSMUX CONFIG - Windows port of universal-tmux
##### Source: Quaerendir/universal-tmux (tmux-universal.conf)
##### Dropped (Linux-only): TPM/resurrect/continuum, tmux-cpu, gpu-stats.sh, /proc/loadavg
##### ==============================================

##### PREFIX #####
set-option -g prefix C-a
bind-key C-a send-prefix
bind-key C-b send-prefix

##### BASICS #####
set -sg escape-time 10
setw -g mode-keys vi
set -g history-limit 20000

# Reload config
unbind-key r
bind-key r source-file ~/.psmux.conf \; display-message "psmux.conf reloaded"

##### MOUSE #####
set -g mouse on

# Disable right-click context menu
unbind-key -n MouseDown3Pane
unbind-key -n MouseDown3Status
unbind-key -n MouseDown3StatusLeft
unbind-key -n MouseDown3StatusRight

##### PANE NAVIGATION #####
# Alt + arrows -> switch between panes
bind-key -n M-Left  select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up    select-pane -U
bind-key -n M-Down  select-pane -D

##### PANE RESIZE #####
# Shift + Alt + arrows -> resize pane
bind-key -n M-S-Left  resize-pane -L 5
bind-key -n M-S-Right resize-pane -R 5
bind-key -n M-S-Up    resize-pane -U 3
bind-key -n M-S-Down  resize-pane -D 3

##### SPLITS #####
# Splits inherit current pane directory
unbind-key -
unbind-key |
bind-key - split-window -v -c "#{pane_current_path}"
bind-key | split-window -h -c "#{pane_current_path}"

# Quick layout: large left pane, rest stacked right
bind-key m select-layout main-vertical

##### PANE MANAGEMENT #####
# Show pane numbers
bind-key q display-panes

# Swap adjacent panes
unbind-key '{'
unbind-key '}'
bind-key '{' swap-pane -U
bind-key '}' swap-pane -D

# Zoom / maximize toggle
unbind-key z
bind-key z resize-pane -Z
bind-key + resize-pane -Z

# Swap panes 1 <-> 2
bind-key R swap-pane -s 1 -t 2

# Interactive swap: prefix + s -> "src tgt" (e.g. 1 2)
bind-key s command-prompt -p "swap src tgt" "swap-pane -s '%%1' -t '%%2'"

##### WINDOWS #####
# New window inherits current directory
unbind-key c
bind-key c new-window -c "#{pane_current_path}"

# Kill without confirmation
unbind-key &
unbind-key x
bind-key & kill-window
bind-key x kill-pane

# Window switching
bind-key -r C-h previous-window
bind-key -r C-l next-window

##### SESSIONS #####
# Session picker
bind-key S choose-session

##### COLOURS - minimal dark theme #####
set -g status-style "bg=colour234,fg=colour249"
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour117
set -g message-style bg=colour234,fg=colour117

##### STATUS BAR #####
set -g status-interval 5
set -g status-justify centre
set -g status-left-length 50
set -g status-right-length 160

set -g status-left "#[fg=colour117,bold] #S #[default]"
# CPU/RAM/GPU/date/host come from a background sampler (~/.psmux/status-daemon.ps1,
# singleton, self-exits when psmux is gone) that sets status-right in every session.
# (run-shell runs in pwsh -> $env:..., while #() runs in cmd -> %..%)
run-shell -b 'Start-Process pwsh -WindowStyle Hidden -ArgumentList "-NoProfile","-File","$env:USERPROFILE\.psmux\status-daemon.ps1"'
# Fallback until the daemon pushes the real value (it overwrites status-right every 5 s)
set -g status-right "#[fg=colour39]%Y-%m-%d %H:%M #[fg=colour117]#H"
