##### ==============================================
##### UNIVERSAL TMUX CONFIG
##### Works on: VPS, desktop, laptop, Jetson/Spark
##### Requires tmux 3.2+
##### ==============================================

##### PREFIX #####
set-option -g prefix C-a
bind-key C-a send-prefix
bind-key C-b send-prefix

##### BASICS #####
set -g default-terminal "screen-256color"
set -sg escape-time 10
setw -g mode-keys vi
set -g history-limit 20000

# Reload config
unbind-key r
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

##### MOUSE #####
set -g mouse on

# Disable right-click context menu (fix for Termius and other GUI terminals)
unbind-key -n MouseDown3Pane
unbind-key -n MouseDown3Status
unbind-key -n MouseDown3StatusLeft
unbind-key -n MouseDown3StatusRight

##### PANE NAVIGATION #####
# Alt + arrows -> switch between panes
bind-key -n M-Left  select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up    select-pane -U
bind-key -n M-Down  select-pane -D

##### PANE RESIZE #####
# Shift + Alt + arrows -> resize pane
bind-key -n M-S-Left  resize-pane -L 5
bind-key -n M-S-Right resize-pane -R 5
bind-key -n M-S-Up    resize-pane -U 3
bind-key -n M-S-Down  resize-pane -D 3

##### SPLITS #####
# Splits inherit current pane directory
unbind-key -
unbind-key |
bind-key - split-window -v -c "#{pane_current_path}"
bind-key | split-window -h -c "#{pane_current_path}"

# Quick layout: large left pane, rest stacked right
bind-key m select-layout main-vertical

##### PANE MANAGEMENT #####
# Show pane numbers
bind-key q display-panes

# Swap adjacent panes
unbind-key '{'
unbind-key '}'
bind-key '{' swap-pane -U
bind-key '}' swap-pane -D

# Zoom / maximize toggle
unbind-key z
bind-key z resize-pane -Z
bind-key + resize-pane -Z

# Swap panes 1 <-> 2
bind-key R swap-pane -s 1 -t 2

# Interactive swap: prefix + s -> "src tgt" (e.g. 1 2)
bind-key s command-prompt -p "swap src tgt" "swap-pane -s '%%1' -t '%%2'"

##### WINDOWS #####
# New window inherits current directory
unbind-key c
bind-key c new-window -c "#{pane_current_path}"

# Kill without confirmation
unbind-key &
unbind-key x
bind-key & kill-window
bind-key x kill-pane

# Window switching
bind-key -r C-h previous-window
bind-key -r C-l next-window

##### SESSIONS #####
# Session picker
bind-key S choose-session

##### COLOURS — minimal dark theme #####
set -g status-bg colour234
set -g status-fg colour249
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour117
set -g message-style bg=colour234,fg=colour117

##### TPM + PLUGINS #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect — safe bindings (Termius/GUI terminals intercept C-s)
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# Continuum — auto-save & auto-restore
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TPM (must be before status bar override)
run '~/.tmux/plugins/tpm/tpm'

# ============================================================
# STATUS BAR — after TPM so we override any plugin/theme defaults
# ============================================================
set -g status-interval 5
set -g status-justify centre
set -g status-left-length 50
set -g status-right-length 160

set -g status-left "#[fg=colour117,bold] #S #[default]"

# CPU & RAM via tmux-cpu plugin (direct script calls to survive theme overrides)
# GPU via universal auto-detect script (~/.tmux/gpu-stats.sh)
# Loadavg from /proc (Linux) or sysctl (macOS)
set -g status-right "\
#[fg=cyan]CPU:#(~/.tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh 2>/dev/null || echo 'N/A') \
#[fg=magenta]RAM:#(~/.tmux/plugins/tmux-cpu/scripts/ram_percentage.sh 2>/dev/null || echo 'N/A') \
#[fg=yellow]#(~/.tmux/gpu-stats.sh 2>/dev/null) \
#[fg=green]#(cat /proc/loadavg 2>/dev/null | cut -d' ' -f1-3 || sysctl -n vm.loadavg 2>/dev/null | tr -d '{}') \
#[fg=colour39]%Y-%m-%d %H:%M \
#[fg=colour117]#H"
